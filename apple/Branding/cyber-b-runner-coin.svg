<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1A0B3B"/><stop offset="1" stop-color="#07030F"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="28"/></filter></defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <g stroke="#FF2BD6" stroke-width="3" opacity="0.18">
    <line x1="0" y1="800" x2="1024" y2="800"/><line x1="0" y1="860" x2="1024" y2="860"/><line x1="0" y1="935" x2="1024" y2="935"/>
    <line x1="512" y1="760" x2="512" y2="1024"/><line x1="380" y1="760" x2="200" y2="1024"/><line x1="644" y1="760" x2="824" y2="1024"/>
    <line x1="250" y1="760" x2="-100" y2="1024"/><line x1="774" y1="760" x2="1124" y2="1024"/></g>
  <circle cx="512" cy="490" r="330" fill="#FF2BD6" opacity="0.25" filter="url(#softglow)"/>
  <!-- Coin: magenta rim, yellow inner ring -->
  <g filter="url(#glow)" fill="none">
    <circle cx="512" cy="490" r="320" stroke="#FF2BD6" stroke-width="30"/>
    <circle cx="512" cy="490" r="268" stroke="#F5FF3D" stroke-width="10" opacity="0.9"/>
  </g>
  <!-- Speed lines -->
  <g filter="url(#glow)" stroke="#FF2BD6" stroke-width="22" stroke-linecap="round">
    <line x1="275" y1="410" x2="345" y2="410"/>
    <line x1="255" y1="490" x2="345" y2="490"/>
    <line x1="275" y1="570" x2="335" y2="570"/>
  </g>
  <!-- Runner (cyan neon) -->
  <g filter="url(#glow)" fill="none" stroke="#00F0FF" stroke-width="44" stroke-linecap="round" stroke-linejoin="round">
    <path d="M560 395 L505 525"/>
    <path d="M545 425 L620 462 L662 414"/>
    <path d="M545 425 L470 440 L432 492"/>
    <path d="M505 525 L598 574 L584 676"/>
    <path d="M505 525 L452 612 L384 603"/>
  </g>
  <circle filter="url(#glow)" cx="592" cy="332" r="42" fill="#00F0FF"/>
  <!-- Sparkles -->
  <g filter="url(#glow)" fill="#F5FF3D">
    <path d="M810 175 L824 212 L861 226 L824 240 L810 277 L796 240 L759 226 L796 212 Z"/>
    <path d="M200 760 L209 783 L232 792 L209 801 L200 824 L191 801 L168 792 L191 783 Z"/>
  </g>
</svg>
