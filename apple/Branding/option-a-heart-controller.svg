<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22C55E"/>
      <stop offset="1" stop-color="#0E7490"/>
    </linearGradient>
    <linearGradient id="heart" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF5A6E"/>
      <stop offset="1" stop-color="#E11D48"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- Controller body: rounded bar plus two grips -->
  <g fill="#FFFFFF">
    <rect x="170" y="360" width="684" height="290" rx="145"/>
    <circle cx="300" cy="610" r="150"/>
    <circle cx="724" cy="610" r="150"/>
  </g>
  <!-- D-pad -->
  <g fill="#0F766E">
    <rect x="250" y="470" width="120" height="40" rx="12"/>
    <rect x="290" y="430" width="40" height="120" rx="12"/>
  </g>
  <!-- Buttons -->
  <g fill="#0F766E">
    <circle cx="734" cy="440" r="24"/>
    <circle cx="734" cy="540" r="24"/>
    <circle cx="684" cy="490" r="24"/>
    <circle cx="784" cy="490" r="24"/>
  </g>
  <!-- Heart in the middle, with a pulse line through it -->
  <path fill="url(#heart)" d="M512 640
    C 470 600, 404 556, 404 490
    C 404 448, 436 418, 474 418
    C 494 418, 506 428, 512 440
    C 518 428, 530 418, 550 418
    C 588 418, 620 448, 620 490
    C 620 556, 554 600, 512 640 Z"/>
  <polyline points="420,500 470,500 492,462 520,540 542,480 560,500 604,500"
            fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
