<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#312E81"/>
    </linearGradient>
    <radialGradient id="coin" cx="0.38" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#FFE58A"/>
      <stop offset="0.55" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#D97706"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- Coin -->
  <circle cx="512" cy="512" r="350" fill="#B45309"/>
  <circle cx="512" cy="500" r="350" fill="url(#coin)"/>
  <circle cx="512" cy="500" r="292" fill="none" stroke="#FDE68A" stroke-width="14" opacity="0.8"/>
  <!-- Speed lines -->
  <g stroke="#B45309" stroke-width="30" stroke-linecap="round" opacity="0.55">
    <line x1="270" y1="420" x2="350" y2="420"/>
    <line x1="245" y1="500" x2="345" y2="500"/>
    <line x1="270" y1="580" x2="340" y2="580"/>
  </g>
  <!-- Runner -->
  <g fill="none" stroke="#92400E" stroke-width="54" stroke-linecap="round" stroke-linejoin="round">
    <path d="M560 400 L505 535"/>                      <!-- torso -->
    <path d="M545 430 L620 470 L665 420"/>             <!-- front arm -->
    <path d="M545 430 L470 445 L430 500"/>             <!-- back arm -->
    <path d="M505 535 L600 585 L585 690"/>             <!-- front leg -->
    <path d="M505 535 L450 625 L380 615"/>             <!-- back leg -->
  </g>
  <circle cx="592" cy="335" r="48" fill="#92400E"/>
  <!-- Sparkles -->
  <g fill="#FDE68A">
    <path d="M800 210 L815 250 L855 265 L815 280 L800 320 L785 280 L745 265 L785 250 Z"/>
    <path d="M210 790 L220 815 L245 825 L220 835 L210 860 L200 835 L175 825 L200 815 Z"/>
  </g>
</svg>
