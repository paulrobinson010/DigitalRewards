# Generate the Xcode project with:  brew install xcodegen && xcodegen generate
name: DigitalRewards
options:
  bundleIdPrefix: com.digitalrewards
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    DEVELOPMENT_TEAM: UPF9A27355
    # The iPhone app's bundle ID. The watch app's ID is derived from it and must
    # start with it, or App Store validation rejects the archive.
    APP_BUNDLE_ID: com.paulrobinson.digitalrewards.app
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic

packages:
  RewardsCore:
    path: Packages/RewardsCore

targets:
  DigitalRewards:
    type: application
    platform: iOS
    sources:
      - path: iOS
        excludes: ["Info.plist", "*.entitlements"]
      - path: Shared
    dependencies:
      - package: RewardsCore
      - target: DigitalRewardsWatch
        embed: true
        copy:
          destination: productsDirectory
          subpath: $(CONTENTS_FOLDER_PATH)/Watch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: DigitalRewards
        UILaunchScreen: {}
        CKSharingSupported: true
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [remote-notification, fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.digitalrewards.app.refresh]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: iOS/DigitalRewards.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.com.digitalrewards.app]
        com.apple.developer.icloud-services: [CloudKit]
        aps-environment: development

  DigitalRewardsWatch:
    type: application
    platform: watchOS
    sources:
      - path: Watch
        excludes: ["Info.plist", "*.entitlements"]
      - path: Shared
    dependencies:
      - package: RewardsCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: DigitalRewards
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(APP_BUNDLE_ID)
        WKRunsIndependentlyOfCompanionApp: false
        WKBackgroundModes: [workout-processing]
        NSHealthShareUsageDescription: DigitalRewards reads your heart rate during workouts to check you're moving fast enough to earn minutes.
        NSHealthUpdateUsageDescription: DigitalRewards saves your workouts to the Health app.
        NSMotionUsageDescription: DigitalRewards uses your step rate to check walks are brisk enough to earn minutes.
    entitlements:
      path: Watch/DigitalRewardsWatch.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.com.digitalrewards.app]
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.healthkit: true

schemes:
  DigitalRewards:
    build:
      targets:
        DigitalRewards: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
  DigitalRewardsWatch:
    build:
      targets:
        DigitalRewardsWatch: all
    run:
      config: Debug
