<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>DigitalRewards sign-in</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f7f6; --fg: #1d2420; --muted: #5d6a63; }
  @media (prefers-color-scheme: dark) { :root { --bg: #121614; --fg: #e8ece9; --muted: #9aa69f; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg);
         color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; }
  main { max-width: 28rem; text-align: center; }
  p { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1 id="title">Finishing sign-in…</h1>
  <p id="detail">Handing your sign-in to DigitalRewards on this PC.</p>
</main>
<script>
  // Apple's CloudKit sign-in must call back to an https page, but the DigitalRewards
  // tray app listens on http://localhost. This page only forwards the token to this
  // same PC: it never sends it anywhere else.
  (function () {
    var params = new URLSearchParams(location.search);
    new URLSearchParams(location.hash.replace(/^#/, "")).forEach(function (v, k) { params.set(k, v); });
    if (!params.get("ckWebAuthToken") && !params.get("ckSession")) {
      document.getElementById("title").textContent = "Nothing to do here";
      document.getElementById("detail").textContent =
        "This page finishes iCloud sign-in for the DigitalRewards PC app. Start sign-in from the tray icon.";
      return;
    }
    history.replaceState(null, "", location.pathname); // keep the token out of history
    location.replace("http://localhost:43117/ck-callback?" + params.toString());
  })();
</script>
</body>
</html>
